# Deploy signaling only: railway up --service signaling
# Set CORS_ORIGIN and expose the public URL as NEXT_PUBLIC_SIGNALING_URL in Vercel.
[build]
builder = "NIXPACKS"
buildCommand = "npm ci"

[deploy]
startCommand = "npm run start:signal"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
