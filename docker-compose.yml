services:
  pairflux:
    build: .
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      - PORT=3002
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000
      - NEXT_PUBLIC_SIGNALING_URL=http://localhost:3002
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pairflux
    profiles:
      - production
